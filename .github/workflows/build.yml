name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > sdk.log 2>&1 || true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Publish result on branch apk-build
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out
          echo "commit $GITHUB_SHA, run $GITHUB_RUN_ID" > /tmp/out/run.txt
          cp build.log /tmp/out/ 2>/dev/null || true
          cp sdk.log /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/etichette.apk 2>/dev/null || true
          mkdir /tmp/pub && cd /tmp/pub
          git init -q
          git checkout -q -b apk-build
          cp /tmp/out/* .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Risultato compilazione $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin apk-build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etichette-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
